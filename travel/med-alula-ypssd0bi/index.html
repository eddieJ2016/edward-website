<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Western Med, Egypt &amp; Arabia — 34 Days</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#111114; --panel:#1a1a1f; --panel2:#222229; --ink:#e8e6e0; --dim:#9a968c;
    --train:#e8b33c; --ferry:#4da3ff; --bus:#79c979; --car:#ff6a4d; --wd:#d98cff; --flight:#8fd3d6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; background:var(--bg); color:var(--ink);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  #app{display:flex; height:100%}
  #side{width:340px; min-width:280px; overflow-y:auto; background:var(--panel);
    border-right:1px solid #2c2c33; padding:18px 0 40px}
  #side h1{font-size:17px; letter-spacing:.08em; padding:0 18px 4px; text-transform:uppercase}
  #side .sub{font-size:12px; color:var(--dim); padding:0 18px 14px}
  .section{margin-top:14px}
  .section h2{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
    padding:6px 18px}
  .day{display:flex; gap:10px; align-items:baseline; padding:7px 18px; cursor:pointer;
    border-left:3px solid transparent; font-size:13.5px; line-height:1.35}
  .day:hover{background:var(--panel2)}
  .day.active{background:var(--panel2); border-left-color:var(--ink)}
  .day .n{font-weight:700; min-width:24px; color:var(--dim)}
  .day.active .n{color:var(--ink)}
  .day .modes{margin-left:auto; display:flex; gap:4px; align-self:center}
  .dot{width:8px; height:8px; border-radius:50%}
  #map{flex:1; min-width:0}
  .leaflet-container{background:#111114}
  /* numbered stop markers */
  .stopmark{display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; background:#26262e; color:var(--ink);
    border:2px solid #8a877e; font:700 11px 'Helvetica Neue',Helvetica,sans-serif;
    box-shadow:0 1px 6px rgba(0,0,0,.6)}
  .stopmark.excursion{border-style:dashed; opacity:.9}
  .stopmark.hot{border-color:var(--ink); background:#3a3a44}
  /* detail card */
  #card{position:absolute; right:16px; top:64px; z-index:1000; width:360px; max-width:calc(100% - 32px);
    max-height:calc(100% - 140px); overflow-y:auto; background:rgba(20,20,25,.96); border:1px solid #34343c;
    border-radius:8px; padding:16px 18px; display:none; box-shadow:0 6px 30px rgba(0,0,0,.55)}
  #card h3{font-size:15px; margin-bottom:2px}
  #card .where{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
    margin-bottom:10px}
  #card ul{list-style:none}
  #card li{font-size:13px; line-height:1.5; padding:3px 0 3px 14px; position:relative; color:#d8d5cd}
  #card li::before{content:''; position:absolute; left:0; top:10px; width:6px; height:6px;
    border-radius:50%; background:#5a5a64}
  #card li.transfer::before{background:var(--mode-c,#5a5a64)}
  #card li.transfer{color:var(--ink)}
  #card li.warn{color:#e6b8a2; font-style:italic}
  #card li.warn::before{background:#c07a55}
  #card .sleep{margin-top:10px; font-size:12px; color:var(--dim); border-top:1px solid #2e2e36; padding-top:8px}
  #card .close{position:absolute; top:8px; right:12px; cursor:pointer; color:var(--dim); font-size:18px}
  /* legend + view buttons */
  #legend{position:absolute; left:356px; bottom:16px; z-index:1000; background:rgba(20,20,25,.92);
    border:1px solid #34343c; border-radius:8px; padding:10px 14px; font-size:11.5px; display:flex;
    gap:14px; flex-wrap:wrap; max-width:calc(100% - 380px)}
  #legend span{display:flex; align-items:center; gap:6px; color:#cfccc4}
  #legend i{display:inline-block; width:18px; height:0; border-top:3px solid}
  #legend i.dash{border-top-style:dashed}
  #views{position:absolute; left:356px; top:16px; z-index:1000; display:flex; gap:8px}
  #views button{background:rgba(20,20,25,.92); color:var(--ink); border:1px solid #34343c;
    border-radius:6px; padding:7px 14px; font-size:12px; letter-spacing:.06em; cursor:pointer}
  #views button:hover{background:#2a2a32}
  #views button.on{border-color:#8a877e; background:#2e2e38}
  #views .vsep{width:1px; background:#34343c; margin:4px 2px}
  body[data-variant="A"] .day[data-v="B"]{display:none}
  body[data-variant="B"] .day[data-v="A"]{display:none}
  @media (max-width:820px){
    #app{flex-direction:column}
    #side{width:100%; max-height:38%}
    #legend{left:16px; max-width:calc(100% - 32px)}
    #views{left:16px}
  }
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <h1>Western Med &rarr; Arabia</h1>
    <div class="sub">34 days &middot; Madrid &rarr; Sardinia &rarr; AlUla &middot; day-by-day route</div>
    <div id="daylist"></div>
  </nav>
  <div id="map"></div>
</div>
<div id="views">
  <button data-v="all">Whole trip</button>
  <button data-v="eu">Mediterranean</button>
  <button data-v="eg">Egypt &amp; Arabia</button>
</div>
<div id="legend"></div>
<div id="card"><span class="close">&times;</span><div id="cardbody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
// ── Transport modes ─────────────────────────────────────────────────────────
const MODES = {
  train : {c:'#e8b33c', dash:null,   label:'Train'},
  ferry : {c:'#4da3ff', dash:'7 7',  label:'Ferry'},
  bus   : {c:'#79c979', dash:null,   label:'Bus'},
  car   : {c:'#ff6a4d', dash:null,   label:'Car / driver'},
  wd    : {c:'#d98cff', dash:'2 6',  label:'4WD excursion'},
  flight: {c:'#8fd3d6', dash:'1 9',  label:'Flight'},
};

// ── Stops ───────────────────────────────────────────────────────────────────
const STOPS = {
  madrid:     {n:'Madrid',      ll:[40.4168,-3.7038]},
  barcelona:  {n:'Barcelona',   ll:[41.3874, 2.1686]},
  portotorres:{n:'Porto Torres',ll:[40.8372, 8.4004]},
  alghero:    {n:'Alghero',     ll:[40.5587, 8.3190]},
  capocaccia: {n:'Capo Caccia', ll:[40.5678, 8.1636], ex:true},
  castelsardo:{n:'Castelsardo', ll:[40.9146, 8.7128], via:true},
  santateresa:{n:'Santa Teresa Gallura', ll:[41.2394, 9.1888]},
  bonifacio:  {n:'Bonifacio',   ll:[41.3873, 9.1593]},
  corte:      {n:'Corte',       ll:[42.3057, 9.1500]},
  bastia:     {n:'Bastia',      ll:[42.7028, 9.4508]},
  livorno:    {n:'Livorno',     ll:[43.5485,10.3106]},
  pisa:       {n:'Pisa',        ll:[43.7228,10.4017]},
  lucca:      {n:'Lucca',       ll:[43.8430,10.5080], ex:true},
  florence:   {n:'Florence',    ll:[43.7696,11.2558]},
  siena:      {n:'Siena',       ll:[43.3188,11.3308]},
  naples:     {n:'Naples',      ll:[40.8518,14.2681]},
  pompeii:    {n:'Pompeii',     ll:[40.7489,14.4989], ex:true},
  rome:       {n:'Rome',        ll:[41.9028,12.4964]},
  cairoapt:   {n:'Cairo (connection)', ll:[30.1219,31.4056]},
  luxor:      {n:'Luxor',       ll:[25.6872,32.6396]},
  westbank:   {n:'West Bank / Valley of the Kings', ll:[25.7402,32.6014], ex:true},
  dendera:    {n:'Dendera',     ll:[26.1420,32.6700], ex:true},
  aswan:      {n:'Aswan',       ll:[24.0889,32.8998]},
  abusimbel:  {n:'Abu Simbel',  ll:[22.3372,31.6258]},
  safaga:     {n:'Safaga',      ll:[26.7517,33.9420]},
  duba:       {n:'Duba (NEOM)', ll:[27.3513,35.6901]},
  alula:      {n:'AlUla',       ll:[26.6085,37.9218]},
  hegra:      {n:'Hegra',       ll:[26.7917,37.9542], ex:true},
  dubai:      {n:'Dubai / Doha', ll:[25.2532,55.3657]},
};

// ── Days ────────────────────────────────────────────────────────────────────
// legs: [from, to, mode, viaStops?]  (excursions return the same day)
const DAYS = [
 {d:1,  sec:'Madrid & Barcelona', t:'Madrid → Barcelona', at:'barcelona',
  legs:[['madrid','barcelona','train']],
  b:['Arrive Madrid in the morning; luggage near Atocha','Prado + lunch nearby',
     ['t','train','AVE Madrid Atocha → Barcelona Sants · ~2½–3h']],
  warn:'Tue 3 Nov. If the international flight lands too late for a relaxed Prado, shift everything a week or add a Madrid night.',
  sleep:'Barcelona'},
 {d:2,  sec:'Madrid & Barcelona', t:'Barcelona → ferry', at:'barcelona',
  legs:[['barcelona','portotorres','ferry']],
  b:['Morning: Gothic Quarter, waterfront or one Gaudí building',
     ['t','ferry','Grimaldi overnight ferry Barcelona → Porto Torres · Wed 23:59 → Thu ~15:00 · board 21:00–22:00 · private external cabin']],
  warn:'The Wednesday sailing sets the whole start date — confirm before booking the Madrid flight.',
  sleep:'On the ferry'},
 {d:3,  sec:'Sardinia', t:'Porto Torres → Alghero', at:'alghero',
  legs:[['portotorres','alghero','car']],
  b:['Ferry arrives ~15:00',
     ['t','car','Collect Sardinian rental; Porto Torres → Alghero · ~40 min'],
     'Evening in the fortified old town'],
  sleep:'Alghero'},
 {d:4,  sec:'Sardinia', t:'Alghero & Capo Caccia', at:'alghero',
  legs:[['alghero','capocaccia','car']],
  b:['Morning in Alghero',['t','car','Capo Caccia + the limestone coast'],
     'Optional nuraghe visit or coastal walk'],
  sleep:'Alghero'},
 {d:5,  sec:'Sardinia', t:'Alghero → Santa Teresa Gallura', at:'santateresa',
  legs:[['alghero','santateresa','car',['castelsardo']]],
  b:[['t','car','Via Castelsardo and Gallura · 3½–4½h without long stops'],
     'Return the car at/near Santa Teresa — needs advance arrangement (few rental offices)'],
  warn:'Do not assume the Sardinian rental may enter Corsica — separate rentals are safer.',
  sleep:'Santa Teresa Gallura'},
 {d:6,  sec:'Corsica', t:'Santa Teresa → Bonifacio', at:'bonifacio',
  legs:[['santateresa','bonifacio','ferry']],
  b:[['t','ferry','Short crossing · 50–60 min · arrive beneath the limestone cliffs'],
     'Taxi to the upper town'],
  warn:'Year-round service is contracted from 1 Nov 2026, but winter crossings are wind-susceptible.',
  sleep:'Bonifacio'},
 {d:7,  sec:'Corsica', t:'Bonifacio', at:'bonifacio',
  b:['Citadel, harbour, cliff paths','Optional boat excursion if the sea permits',
     'Collect the Corsican rental today or tomorrow morning'],
  sleep:'Bonifacio'},
 {d:8,  sec:'Corsica', t:'Bonifacio → Corte', at:'corte',
  legs:[['bonifacio','corte','car']],
  b:[['t','car','Through the interior · ~3–4h, scenic stops per the weather'],
     'Corte old town and citadel'],
  sleep:'Corte'},
 {d:9,  sec:'Corsica', t:'Corte → Bastia', at:'bastia',
  legs:[['corte','bastia','car']],
  b:[['t','car','Mountains down to Bastia · ~1½h'],'Old port and Terra Vecchia; return the car'],
  warn:'South-to-north beats squeezing in Cap Corse — Bonifacio, mountains, Corte, Bastia is the essential contrast.',
  sleep:'Bastia'},
 {d:10, sec:'Italy', t:'Bastia → Livorno → Pisa', at:'pisa',
  legs:[['bastia','livorno','ferry'],['livorno','pisa','train']],
  b:[['t','ferry','Ferry Bastia → Livorno · ~4–5h'],
     ['t','train','Regional Livorno → Pisa · 15–20 min']],
  warn:'November Bastia–Livorno frequency is unconfirmed — published sources conflict. Fallback: Corsica → Toulon ferry + flight/rail to Tuscany. No non-refundable Italian hotels until this crossing is secured.',
  sleep:'Pisa'},
 {d:11, sec:'Italy', t:'Pisa → Lucca → Florence', at:'florence',
  legs:[['pisa','florence','train',['lucca']]],
  b:['Piazza dei Miracoli early',
     ['t','train','Pisa → Lucca · ~30 min; walk the walls; Lucca → Florence · ~1½h']],
  sleep:'Florence'},
 {d:12, sec:'Italy', t:'Florence', at:'florence',
  b:['Uffizi (reserve), Duomo complex, Palazzo Vecchio'], sleep:'Florence'},
 {d:13, sec:'Italy', t:'Florence', at:'florence',
  b:['Accademia (reserve), Santa Croce, Oltrarno'], sleep:'Florence'},
 {d:14, sec:'Italy', t:'Florence → Siena', at:'siena',
  legs:[['florence','siena','bus']],
  b:[['t','bus','Direct bus · 1¼–1½h · arrives near the centre'],
     'Piazza del Campo, cathedral, old streets'],
  sleep:'Siena'},
 {d:15, sec:'Italy', t:'Siena → Naples', at:'naples',
  legs:[['siena','naples','train',['florence']]],
  b:[['t','train','Bus to Florence + high-speed to Naples · ~4½–5h total'],
     'Evening in Naples'],
  sleep:'Naples'},
 {d:16, sec:'Italy', t:'Naples & Pompeii', at:'naples',
  legs:[['naples','pompeii','train']],
  b:['Either: morning train to Pompeii, late afternoon back in Naples',
     'Or: full Naples day — Archaeological Museum, historic centre, churches'],
  warn:'Pompeii + Naples in one day is possible but busy.',
  sleep:'Naples'},
 {d:17, sec:'Italy', t:'Naples → Rome', at:'rome',
  legs:[['naples','rome','train']],
  b:[['t','train','High-speed · ~1h10'],'Afternoon and evening in Rome'],
  sleep:'Rome'},
 {d:18, sec:'Italy', t:'Rome', at:'rome',
  b:['Ancient Rome & Forum, Pantheon & historic centre'], sleep:'Rome'},
 {d:19, sec:'Italy', t:'Rome', at:'rome',
  b:['Vatican Museums & St Peter’s, Trastevere'],
  warn:'A third Rome night is sensible even if you have visited before.',
  sleep:'Rome'},
 {d:20, sec:'Luxor', t:'Rome → Luxor', at:'luxor',
  legs:[['rome','cairoapt','flight'],['cairoapt','luxor','flight']],
  b:[['t','flight','Fiumicino → Cairo → Luxor on one ticket'],
     ['t','car','Prearranged airport car']],
  warn:'Rome–Cairo flies nonstop in November; the seasonal direct Rome–Luxor appears to end in October.',
  sleep:'Luxor'},
 {d:21, sec:'Luxor', t:'East Bank', at:'luxor',
  b:['Karnak; Luxor Museum if time permits; Luxor Temple at sunset'], sleep:'Luxor'},
 {d:22, sec:'Luxor', t:'West Bank', at:'luxor',
  legs:[['luxor','westbank','car']],
  b:[['t','car','Private car + guide'],
     'Valley of the Kings, Hatshepsut, Medinet Habu, optional noble tombs'],
  sleep:'Luxor'},
 {d:23, sec:'Luxor', t:'Dendera or second West Bank', at:'luxor',
  legs:[['luxor','dendera','car']],
  b:['Private road excursion to Dendera — or a slower second West Bank day'],
  warn:'Dendera is excellent but a long outing.',
  sleep:'Luxor'},
 {d:24, sec:'Aswan & Abu Simbel', t:'Luxor → Aswan', at:'aswan',
  legs:[['luxor','aswan','train']],
  b:[['t','train','Daytime train · 3½–4½h'],'Late-afternoon felucca'],
  sleep:'Aswan'},
 {d:25, sec:'Aswan & Abu Simbel', t:'Aswan', at:'aswan',
  b:['Philae by road + boat, Nubian Museum, optional botanical garden'], sleep:'Aswan'},
 {d:26, sec:'Aswan & Abu Simbel', t:'Aswan → Abu Simbel', at:'abusimbel',
  legs:[['aswan','abusimbel','car']],
  b:[['t','car','Licensed private transfer · ~3½–4h'],
     'Afternoon visit after the day-trip crowds depart'],
  sleep:'Abu Simbel (near the temples)'},
 {d:27, sec:'Aswan & Abu Simbel', t:'Abu Simbel → Aswan', at:'aswan',
  legs:[['abusimbel','aswan','car']],
  b:['Optional early second temple visit',['t','car','Private car back to Aswan']],
  warn:'Still preferable to flying down for two rushed hours.',
  sleep:'Aswan'},
 {d:28, sec:'Egypt → Saudi', t:'Aswan → Safaga', at:'safaga',
  legs:[['aswan','safaga','car']],
  b:[['t','car','Prearranged private car · 7–9h — operator must know tourist-road permissions & checkpoints']],
  sleep:'Safaga'},
 {d:29, sec:'Egypt → Saudi', t:'Safaga buffer / ferry → Duba', at:'duba',
  legs:[['safaga','duba','ferry']],
  b:['Keep the day deliberately flexible; confirm ticketing & check-in locally',
     ['t','ferry','Passenger ferry Safaga → Duba/NEOM (MENA Line)']],
  warn:'The trip’s least dependable connection — service is oriented to workers/vehicles. Confirm foreign tourists are accepted BEFORE committing to the Saudi segment.',
  sleep:'Aboard or Duba, per the sailing'},
 {d:30, sec:'Egypt → Saudi', t:'Duba → AlUla', at:'alula',
  legs:[['duba','alula','car']],
  b:['Saudi immigration formalities',
     ['t','car','Prearranged vehicle Duba → AlUla · ~4–5h'],
     'Sunset at Harrat Viewpoint if arrival permits'],
  warn:'No convenient walk-up transport at Duba port — arrange beforehand.',
  sleep:'AlUla'},
 {d:31, sec:'AlUla', t:'Hegra', at:'alula',
  legs:[['alula','hegra','car']],
  b:['Official timed Hegra excursion','Elephant Rock around sunset'],
  sleep:'AlUla'},
 {d:32, sec:'AlUla', t:'Dadan & Jabal Ikmah', at:'alula',
  b:['Dadan, Jabal Ikmah, AlUla Old Town, oasis walk'], sleep:'AlUla'},
 {d:33, sec:'AlUla', t:'AlUla reserve day', at:'alula',
  b:['Wadi/desert excursion, Maraya viewpoint, a second archaeological tour — or rest after the overland haul'],
  sleep:'AlUla'},
 {d:34, sec:'AlUla', t:'AlUla → Dubai or Doha', at:'dubai',
  legs:[['alula','dubai','flight']],
  b:[['t','flight','AlUla → Riyadh or Jeddah → Dubai/Doha'],
     'Connect home, or add Gulf nights'],
  sleep:'—'},
];

// ── Map ─────────────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:true, minZoom:3, maxZoom:12, worldCopyJump:false});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd'}).addTo(map);

const VIEWS = {
  all:[[20.5,-6.5],[46.0,56.5]],
  eu :[[38.5,-5.0],[45.0,13.5]],
  eg :[[21.0,28.0],[32.0,56.5]],
};
const fitAll = ()=> map.fitBounds(VIEWS.all, {padding:[24,24]});
fitAll();
// The container can be sized late (embedded panes resize after load). Keep
// re-fitting on every resize until the user first touches the map.
let userTouched = false;
map.getContainer().addEventListener('pointerdown', ()=>{ userTouched = true; }, {once:true});
const refit = ()=>{ map.invalidateSize(); if (!userTouched) fitAll(); };
window.addEventListener('load', ()=>{ refit(); setTimeout(refit, 250); });
new ResizeObserver(refit).observe(document.getElementById('map'));
document.querySelectorAll('#views button').forEach(b=>{
  b.onclick = ()=> map.fitBounds(VIEWS[b.dataset.v], {padding:[24,24]});
});

// legend
document.getElementById('legend').innerHTML = Object.values(MODES).map(m=>
  `<span><i style="border-color:${m.c}" class="${m.dash?'dash':''}"></i>${m.label}</span>`).join('');

// ── Route variant (A = Minya crossing, B = oasis loop) ──────────────────────
let VARIANT = 'A';
const dayKey = (day)=> `${day.d}${day.v||''}`;
const activeDayObj = (d)=> DAYS.find(x=>x.d===d && (!x.v || x.v===VARIANT));

// ── Legs (polylines) ────────────────────────────────────────────────────────
const legLayers = {};   // dayKey -> layers[]
function legPath(from, to, via, mode){
  const pts = [STOPS[from].ll, ...(via||[]).map(v=>STOPS[v].ll), STOPS[to].ll];
  if (mode==='flight' && pts.length===2){        // curved arc for flights
    const [a,b]=pts, out=[];
    for (let i=0;i<=24;i++){
      const t=i/24, lat=a[0]+(b[0]-a[0])*t, lng=a[1]+(b[1]-a[1])*t;
      const bulge=Math.sin(Math.PI*t)*Math.hypot(b[0]-a[0],b[1]-a[1])*0.12;
      out.push([lat+bulge, lng]);
    }
    return out;
  }
  return pts;
}
const legRecs = [];   // {line, day} for variant toggling
DAYS.forEach(day=>{
  (day.legs||[]).forEach(([f,t,mode,via])=>{
    const m = MODES[mode];
    const line = L.polyline(legPath(f,t,via,mode), {
      color:m.c, weight:3, opacity:.75, dashArray:m.dash||null});
    if (!day.v || day.v===VARIANT) line.addTo(map);
    line.on('click', ()=> openDay(day));
    (legLayers[dayKey(day)] = legLayers[dayKey(day)]||[]).push(line);
    legRecs.push({line, day});
  });
});

// ── Stop markers, numbered by first day slept there ─────────────────────────
const firstDay = {};
DAYS.forEach(day=>{ if(!(day.at in firstDay)) firstDay[day.at]=day.d; });
const markers = {};       // id -> {mk, v}
Object.entries(STOPS).forEach(([id,s])=>{
  if (s.via) return;                       // waypoints get no marker
  const label = s.ex ? '·' : (firstDay[id] ?? '·');
  const mk = L.marker(s.ll, {icon: L.divIcon({className:'',
    html:`<div class="stopmark ${s.ex?'excursion':''}" id="mk-${id}">${label}</div>`,
    iconSize:[26,26], iconAnchor:[13,13]})});
  if (!s.v || s.v===VARIANT) mk.addTo(map);
  mk.bindTooltip(s.n, {direction:'top', offset:[0,-14]});
  mk.on('click', ()=>{
    const day = DAYS.find(x=>x.at===id && (!x.v || x.v===VARIANT))
             || DAYS.find(x=>(x.legs||[]).some(l=>l[1]===id) && (!x.v || x.v===VARIANT));
    if (day) openDay(day);
  });
  markers[id]={mk, v:s.v};
});

// ── Sidebar ─────────────────────────────────────────────────────────────────
const list = document.getElementById('daylist');
let lastSec = null;
DAYS.forEach(day=>{
  if (day.sec!==lastSec){
    lastSec = day.sec;
    const h = document.createElement('div'); h.className='section';
    h.innerHTML = `<h2>${day.sec}</h2>`; list.appendChild(h);
  }
  const el = document.createElement('div');
  el.className='day'; el.id=`day-${dayKey(day)}`;
  if (day.v) el.dataset.v = day.v;
  const dots = [...new Set((day.legs||[]).map(l=>l[2]))]
    .map(m=>`<span class="dot" style="background:${MODES[m].c}"></span>`).join('');
  el.innerHTML = `<span class="n">${day.d}</span><span>${day.t}</span>
                  <span class="modes">${dots}</span>`;
  el.onclick = ()=> openDay(day);
  list.appendChild(el);
});

// ── Detail card + highlighting ──────────────────────────────────────────────
const card = document.getElementById('card'), cardbody = document.getElementById('cardbody');
document.querySelector('#card .close').onclick = ()=>{ card.style.display='none'; setActive(null); };
let activeDay = null;   // day object

function setActive(day){
  if (activeDay){
    document.getElementById(`day-${dayKey(activeDay)}`)?.classList.remove('active');
    (legLayers[dayKey(activeDay)]||[]).forEach(l=>l.setStyle({weight:3, opacity:.75}));
    document.getElementById(`mk-${activeDay.at}`)?.classList.remove('hot');
  }
  activeDay = day || null;
  if (day){
    const el = document.getElementById(`day-${dayKey(day)}`);
    el?.classList.add('active');
    el?.scrollIntoView({block:'nearest'});
    (legLayers[dayKey(day)]||[]).forEach(l=>{ l.setStyle({weight:6, opacity:1}); l.bringToFront(); });
    document.getElementById(`mk-${day.at}`)?.classList.add('hot');
  }
}

function openDay(dayOrNum){
  const day = typeof dayOrNum==='number' ? activeDayObj(dayOrNum) : dayOrNum;
  if(!day) return;
  if (day.v && day.v!==VARIANT) setVariant(day.v);   // clicking a hidden-variant leg
  setActive(day);
  const items = day.b.map(item=>{
    if (Array.isArray(item)){
      const [,mode,text]=item;
      return `<li class="transfer" style="--mode-c:${MODES[mode].c}">${text}</li>`;
    }
    return `<li>${item}</li>`;
  }).join('');
  cardbody.innerHTML = `
    <div class="where">Day ${day.d} · ${day.sec}</div>
    <h3>${day.t}</h3>
    <ul>${items}${day.warn?`<li class="warn">${day.warn}</li>`:''}</ul>
    <div class="sleep">Sleep: ${day.sleep}</div>`;
  card.style.display='block';
  // gently frame the day's geography
  const pts=[STOPS[day.at].ll];
  (day.legs||[]).forEach(([f,t,,via])=>{
    pts.push(STOPS[f].ll, STOPS[t].ll, ...(via||[]).map(v=>STOPS[v].ll));
  });
  if (pts.length>1) map.fitBounds(L.latLngBounds(pts).pad(0.55));
}

// ── Variant toggle ──────────────────────────────────────────────────────────
function setVariant(v){
  if (v===VARIANT) return;
  VARIANT = v;
  document.body.dataset.variant = v;
  legRecs.forEach(({line, day})=>{
    if (!day.v) return;
    if (day.v===v) line.addTo(map); else line.remove();
  });
  Object.values(markers).forEach(({mk, v:mv})=>{
    if (!mv) return;
    if (mv===v) mk.addTo(map); else mk.remove();
  });
  document.querySelectorAll('#views button[data-r]').forEach(b=>
    b.classList.toggle('on', b.dataset.r===v));
  // close any open card whose day belongs to the other variant
  if (activeDay && activeDay.v && activeDay.v!==v){
    card.style.display='none'; setActive(null);
  }
}
document.body.dataset.variant = VARIANT;
document.querySelectorAll('#views button[data-r]').forEach(b=>{
  b.onclick = ()=> setVariant(b.dataset.r);
  b.classList.toggle('on', b.dataset.r===VARIANT);
});
</script>
