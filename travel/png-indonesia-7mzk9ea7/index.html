<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papua New Guinea &rarr; Indonesia — 42 Days</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#111114; --panel:#1a1a1f; --panel2:#222229; --ink:#e8e6e0; --dim:#9a968c;
    --train:#e8b33c; --boat:#4da3ff; --road:#ff6a4d; --flight:#8fd3d6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; background:var(--bg); color:var(--ink);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  #app{display:flex; height:100%}
  #side{width:340px; min-width:280px; overflow-y:auto; background:var(--panel);
    border-right:1px solid #2c2c33; padding:18px 0 40px}
  #side h1{font-size:17px; letter-spacing:.08em; padding:0 18px 4px; text-transform:uppercase}
  #side .sub{font-size:12px; color:var(--dim); padding:0 18px 14px}
  .section{margin-top:14px}
  .section h2{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
    padding:6px 18px}
  .day{display:flex; gap:10px; align-items:baseline; padding:7px 18px; cursor:pointer;
    border-left:3px solid transparent; font-size:13.5px; line-height:1.35}
  .day:hover{background:var(--panel2)}
  .day.active{background:var(--panel2); border-left-color:var(--ink)}
  .day .n{font-weight:700; min-width:40px; color:var(--dim); white-space:nowrap}
  .day.active .n{color:var(--ink)}
  .day .modes{margin-left:auto; display:flex; gap:4px; align-self:center}
  .dot{width:8px; height:8px; border-radius:50%}
  #map{flex:1; min-width:0}
  .leaflet-container{background:#111114}
  /* numbered stop markers */
  .stopmark{display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; background:#26262e; color:var(--ink);
    border:2px solid #8a877e; font:700 11px 'Helvetica Neue',Helvetica,sans-serif;
    box-shadow:0 1px 6px rgba(0,0,0,.6)}
  .stopmark.excursion{border-style:dashed; opacity:.9}
  .stopmark.hot{border-color:var(--ink); background:#3a3a44}
  /* detail card */
  #card{position:absolute; right:16px; top:64px; z-index:1000; width:360px; max-width:calc(100% - 32px);
    max-height:calc(100% - 140px); overflow-y:auto; background:rgba(20,20,25,.96); border:1px solid #34343c;
    border-radius:8px; padding:16px 18px; display:none; box-shadow:0 6px 30px rgba(0,0,0,.55)}
  #card h3{font-size:15px; margin-bottom:2px}
  #card .where{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
    margin-bottom:10px}
  #card ul{list-style:none}
  #card li{font-size:13px; line-height:1.5; padding:3px 0 3px 14px; position:relative; color:#d8d5cd}
  #card li::before{content:''; position:absolute; left:0; top:10px; width:6px; height:6px;
    border-radius:50%; background:#5a5a64}
  #card li.transfer::before{background:var(--mode-c,#5a5a64)}
  #card li.transfer{color:var(--ink)}
  #card li.warn{color:#e6b8a2; font-style:italic}
  #card li.warn::before{background:#c07a55}
  #card .sleep{margin-top:10px; font-size:12px; color:var(--dim); border-top:1px solid #2e2e36; padding-top:8px}
  #card .close{position:absolute; top:8px; right:12px; cursor:pointer; color:var(--dim); font-size:18px}
  /* legend + view buttons */
  #legend{position:absolute; left:356px; bottom:16px; z-index:1000; background:rgba(20,20,25,.92);
    border:1px solid #34343c; border-radius:8px; padding:10px 14px; font-size:11.5px; display:flex;
    gap:14px; flex-wrap:wrap; max-width:calc(100% - 380px)}
  #legend span{display:flex; align-items:center; gap:6px; color:#cfccc4}
  #legend i{display:inline-block; width:18px; height:0; border-top:3px solid}
  #legend i.dash{border-top-style:dashed}
  #views{position:absolute; left:356px; top:16px; z-index:1000; display:flex; gap:8px; flex-wrap:wrap;
    max-width:calc(100% - 380px)}
  #views button{background:rgba(20,20,25,.92); color:var(--ink); border:1px solid #34343c;
    border-radius:6px; padding:7px 14px; font-size:12px; letter-spacing:.06em; cursor:pointer}
  #views button:hover{background:#2a2a32}
  @media (max-width:820px){
    #app{flex-direction:column}
    #side{width:100%; max-height:38%}
    #legend{left:16px; max-width:calc(100% - 32px)}
    /* keep the buttons and card on the map, below the stacked sidebar */
    #views{left:16px; top:calc(38% + 12px); max-width:calc(100% - 32px); gap:6px}
    #views button{padding:6px 10px; font-size:11px}
    #card{left:16px; right:16px; width:auto; top:auto; bottom:16px; max-height:44%}
    .leaflet-control-zoom{display:none}   /* pinch-zoom on phones; the legend sits there */
  }
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <h1>PNG &rarr; Indonesia</h1>
    <div class="sub">42 days &middot; Sydney &rarr; Port Moresby &rarr; Padang &rarr; Sydney &middot; draft route, no dates set</div>
    <div id="daylist"></div>
  </nav>
  <div id="map"></div>
</div>
<div id="views">
  <button data-v="all">Whole trip</button>
  <button data-v="png">PNG &amp; Papua</button>
  <button data-v="east">Raja Ampat &amp; Banda</button>
  <button data-v="west">Flores &rarr; Sumatra</button>
</div>
<div id="legend"></div>
<div id="card"><span class="close">&times;</span><div id="cardbody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
// ── Transport modes ─────────────────────────────────────────────────────────
const MODES = {
  flight: {c:'#8fd3d6', dash:'1 9',  label:'Flight'},
  boat  : {c:'#4da3ff', dash:'7 7',  label:'Boat / ferry'},
  road  : {c:'#ff6a4d', dash:null,   label:'Road / driver'},
  train : {c:'#e8b33c', dash:null,   label:'Train'},
};

// ── Stops (geocoded with OSM Nominatim, 30 Oct 2026) ────────────────────────
const STOPS = {
  sydney:     {n:'Sydney (start & end)', ll:[-33.8698,151.2083]},
  portmoresby:{n:'Port Moresby',      ll:[-9.4743,147.1600]},
  goroka:     {n:'Goroka (or Mount Hagen)', ll:[-6.0730,145.3933]},
  wewak:      {n:'Wewak',             ll:[-3.5542,143.6271]},
  sepik:      {n:'Sepik River (Pagwi)', ll:[-4.0565,143.0298]},
  vanimo:     {n:'Vanimo',            ll:[-2.6848,141.3009]},
  wutung:     {n:'Wutung–Skouw border', ll:[-2.6082,141.0086], via:true},
  sentani:    {n:'Jayapura / Sentani', ll:[-2.5661,140.5057]},
  wamena:     {n:'Wamena · Baliem Valley', ll:[-4.0944,138.9467]},
  sorong:     {n:'Sorong',            ll:[-0.8634,131.2545]},
  waisai:     {n:'Waisai',            ll:[-0.4211,130.8230], via:true},
  rajaampat:  {n:'Raja Ampat (central base, e.g. Kri)', ll:[-0.5608,130.6757]},
  ambon:      {n:'Ambon',             ll:[-3.6959,128.1788]},
  banda:      {n:'Banda Neira',       ll:[-4.5213,129.9044]},
  labuanbajo: {n:'Labuan Bajo',       ll:[-8.4899,119.8765]},
  ruteng:     {n:'Ruteng',            ll:[-8.6111,120.4644], ex:true},
  padar:      {n:'Padar · Komodo · Rinca', ll:[-8.6627,119.5557], ex:true},
  denpasar:   {n:'Bali airport',      ll:[-8.7465,115.1674], via:true},
  ubud:       {n:'Ubud or Sidemen',   ll:[-8.5170,115.2551]},
  gilimanuk:  {n:'Gilimanuk',         ll:[-8.1620,114.4374], via:true},
  ketapang:   {n:'Ketapang (Banyuwangi)', ll:[-8.1426,114.4005], via:true},
  bromo:      {n:'Bromo (Cemoro Lawang)', ll:[-7.9421,112.9530]},
  probolinggo:{n:'Probolinggo',       ll:[-7.7427,113.2160], via:true},
  surabaya:   {n:'Surabaya',          ll:[-7.2653,112.7526], via:true},
  yogya:      {n:'Yogyakarta',        ll:[-7.7953,110.3673]},
  borobudur:  {n:'Borobudur',         ll:[-7.6064,110.2045], ex:true},
  prambanan:  {n:'Prambanan',         ll:[-7.7522,110.4915], ex:true},
  padang:     {n:'Padang',            ll:[-0.9248,100.3633]},
  bukittinggi:{n:'Bukittinggi',       ll:[-0.3052,100.3695]},
};

// ── Stages ──────────────────────────────────────────────────────────────────
// d = first day, dl = day label. legs: [from, to, mode, viaStops?]
// Content follows the Craft draft (30 Oct 2026); amber notes add the advisory checks.
const DAYS = [
 {d:1,  dl:'1',     sec:'Papua New Guinea', t:'Sydney → Port Moresby', at:'portmoresby',
  legs:[['sydney','portmoresby','flight']],
  b:[['t','flight','Fly Sydney → Port Moresby']],
  warn:'Verify PNG entry requirements for both travellers before booking.',
  sleep:'Port Moresby'},
 {d:2,  dl:'2–4',   sec:'Papua New Guinea', t:'The Highlands', at:'goroka',
  legs:[['portmoresby','goroka','flight']],
  b:[['t','flight','Fly to Goroka or Mount Hagen'],
     'Explore the Highlands with a local guide'],
  warn:'Smartraveller (Oct 2026) says reconsider your need to travel to Mount Hagen. Goroka is not on that list, so it is the safer pick.',
  sleep:'Goroka (or Mount Hagen)'},
 {d:5,  dl:'5–7',   sec:'Papua New Guinea', t:'Wewak & the Sepik River', at:'sepik',
  legs:[['goroka','wewak','flight'],['wewak','sepik','road']],
  b:[['t','flight','Fly the Highlands → Wewak (check the routing; it may connect)'],
     ['t','road','Road to the river at Pagwi, then by boat'],
     'Villages, river journeys, carving and traditional architecture'],
  warn:'Wet season. Three days including the Wewak transfers leaves little time on the river itself.',
  sleep:'Wewak / Sepik villages'},
 {d:8,  dl:'8',     sec:'Papua New Guinea', t:'Sepik → Vanimo', at:'vanimo',
  legs:[['sepik','wewak','road'],['wewak','vanimo','flight']],
  b:[['t','road','Back to Wewak'],
     ['t','flight','Fly Wewak → Vanimo (no road link)'],
     'Position for the Jayapura border'],
  warn:'Verify border status, permissions, safety and onward transport before committing; a flight detour may be necessary.',
  sleep:'Vanimo'},
 {d:9,  dl:'9',     sec:'Indonesian Papua', t:'Vanimo → border → Jayapura', at:'sentani',
  legs:[['vanimo','sentani','road',['wutung']]],
  b:[['t','road','Road to Wutung, cross at Skouw, on to Jayapura (~1½–2 h from the border)']],
  warn:'Get the Indonesian visa before the border: visa on arrival at Skouw is unconfirmed. Guides also list a travel permit (surat jalan). The post has closed before because of nearby gunfire, and there are no ATMs, so carry cash.',
  sleep:'Jayapura / Sentani'},
 {d:10, dl:'10–12', sec:'Indonesian Papua', t:'Wamena & the Baliem Valley', at:'wamena',
  legs:[['sentani','wamena','flight']],
  b:[['t','flight','Fly Sentani → Wamena'],
     'Three nights: guided Baliem Valley village walks and highland landscapes'],
  warn:'Wamena is in Highland Papua. Smartraveller (Oct 2026) says reconsider your need to travel; the US says do not travel (Jul 2026). Check your travel insurance covers it. A police travel permit (surat jalan) may be needed.',
  sleep:'Wamena ×3'},
 {d:13, dl:'13–19', sec:'Raja Ampat', t:'Raja Ampat', at:'rajaampat',
  legs:[['wamena','sentani','flight'],['sentani','sorong','flight'],['sorong','rajaampat','boat',['waisai']]],
  b:[['t','flight','Wamena → Jayapura → Sorong'],
     ['t','boat','Ferry Sorong → Waisai, then boat to the base'],
     'Six nights: karst islands, snorkeling, birds-of-paradise and villages',
     'Choose a central/northern base; Misool needs extra transfer time and cost',
     'Budget for marine entry permits and boat excursions'],
  warn:'Wamena → Jayapura → Sorong → boat is a lot for one day; a night in Sorong may be needed.',
  sleep:'Raja Ampat ×6'},
 {d:20, dl:'20–24', sec:'Maluku: Banda Islands', t:'Ambon & the Banda Islands', at:'banda',
  legs:[['sorong','ambon','flight'],['ambon','banda','boat']],
  b:[['t','flight','Fly Sorong → Ambon'],
     ['t','boat','Scheduled ferry/boat — or flight — to Banda Neira'],
     'Fort Belgica, nutmeg plantations, Banda Api, colonial history and snorkeling',
     ['t','boat','Return to Ambon']],
  warn:'Build the trip around actual Banda transport dates; do not assume daily service. Crossings may be disrupted in January–February.',
  sleep:'Ambon / Banda Neira'},
 {d:25, dl:'25–29', sec:'Flores & Komodo', t:'Labuan Bajo, Flores & Komodo', at:'labuanbajo',
  legs:[['ambon','labuanbajo','flight'],['labuanbajo','ruteng','road'],
        ['labuanbajo','padar','boat'],['labuanbajo','denpasar','flight']],
  b:[['t','flight','Fly Ambon → Labuan Bajo, usually with a connection'],
     ['t','road','Western Flores around Ruteng or nearby villages, if time allows'],
     ['t','boat','Two-day/overnight Komodo trip: Padar, Komodo or Rinca, snorkeling'],
     ['t','flight','Fly Labuan Bajo → Bali']],
  warn:'Boat outings are weather-dependent: January–February can bring rough seas, cancelled boats and heavy rain. Keep a buffer day here.',
  sleep:'Labuan Bajo / aboard'},
 {d:30, dl:'30–31', sec:'Bali', t:'Bali', at:'ubud',
  legs:[['denpasar','ubud','road']],
  b:[['t','road','Airport → Ubud or Sidemen'],
     'Two nights: temples, countryside, food and rest'],
  sleep:'Ubud or Sidemen ×2'},
 {d:32, dl:'32–34', sec:'East Java', t:'Bali → Bromo → Yogyakarta', at:'bromo',
  legs:[['ubud','gilimanuk','road'],['gilimanuk','ketapang','boat'],['ketapang','bromo','road'],
        ['bromo','probolinggo','road'],['probolinggo','yogya','train',['surabaya']]],
  b:[['t','road','Transfer Bali → East Java: overland via the Gilimanuk–Ketapang ferry (a long day), or fly Denpasar → Surabaya'],
     'Mount Bromo and the Tengger caldera',
     ['t','train','Continue by train via Surabaya toward Yogyakarta'],
     'Optional: Ijen crater is beside Banyuwangi on the overland route'],
  sleep:'Bromo (Cemoro Lawang)'},
 {d:35, dl:'35–38', sec:'Yogyakarta', t:'Yogyakarta', at:'yogya',
  legs:[['yogya','borobudur','road'],['yogya','prambanan','road']],
  b:['Borobudur, Prambanan, the Kraton and one unstructured day',
     'Four nights for classical Javanese and Islamic court history'],
  warn:'On a mid-January start these days fall in Ramadan (expected from about 8 Feb 2027): many restaurants close in daylight and food stalls open towards sunset.',
  sleep:'Yogyakarta ×4'},
 {d:39, dl:'39–42', sec:'West Sumatra', t:'Padang & Bukittinggi', at:'bukittinggi',
  legs:[['yogya','padang','flight'],['padang','bukittinggi','road'],['padang','sydney','flight']],
  b:[['t','flight','Fly Yogyakarta → Padang (direct if schedules permit, otherwise connecting)'],
     ['t','road','Up to Bukittinggi'],
     'Ngarai Sianok, Minangkabau villages and rumah gadang architecture',
     ['t','flight','Padang → Sydney via a regional hub; arrival may spill into Day 43']],
  warn:'Also inside Ramadan on a mid-January start. West Sumatra is strongly Muslim, so daytime closures are more noticeable here.',
  sleep:'Bukittinggi'},
];

// ── Map ─────────────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:false, minZoom:3, maxZoom:12, worldCopyJump:false});
L.control.zoom({position:'bottomright'}).addTo(map);   // top-left sits under the view buttons
// CARTO's basemaps began requiring an API key (Oct 2026); Esri's dark canvas is keyless.
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(ESRI+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  {attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors', maxNativeZoom:16}).addTo(map);
map.createPane('labels');                 // place labels: above the base, below routes
map.getPane('labels').style.zIndex = 350;
map.getPane('labels').style.pointerEvents = 'none';
L.tileLayer(ESRI+'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
  {maxNativeZoom:16, pane:'labels'}).addTo(map);

const VIEWS = {
  all :[[-34.5, 99.5],[0.5,152.0]],
  png :[[-10.0,138.4],[-2.2,147.6]],
  east:[[-4.9,127.8],[-0.2,131.6]],
  west:[[-9.0, 99.8],[-0.1,120.8]],
};
const fitAll = ()=> map.fitBounds(VIEWS.all, {padding:[24,24]});
fitAll();
// The container can be sized late (embedded panes resize after load). Keep
// re-fitting on every resize until the user first touches the map.
let userTouched = false;
map.getContainer().addEventListener('pointerdown', ()=>{ userTouched = true; }, {once:true});
const refit = ()=>{ map.invalidateSize(); if (!userTouched) fitAll(); };
window.addEventListener('load', ()=>{ refit(); setTimeout(refit, 250); });
new ResizeObserver(refit).observe(document.getElementById('map'));
document.querySelectorAll('#views button').forEach(b=>{
  b.onclick = ()=>{ userTouched = true; map.fitBounds(VIEWS[b.dataset.v], {padding:[24,24]}); };
});

// legend
document.getElementById('legend').innerHTML = Object.values(MODES).map(m=>
  `<span><i style="border-color:${m.c}" class="${m.dash?'dash':''}"></i>${m.label}</span>`).join('');

// ── Legs (polylines) ────────────────────────────────────────────────────────
const legLayers = {};   // d -> layers[]
function legPath(from, to, via, mode){
  const pts = [STOPS[from].ll, ...(via||[]).map(v=>STOPS[v].ll), STOPS[to].ll];
  if (mode==='flight' && pts.length===2){        // curved arc for flights
    const [a,b]=pts, out=[];
    for (let i=0;i<=24;i++){
      const t=i/24, lat=a[0]+(b[0]-a[0])*t, lng=a[1]+(b[1]-a[1])*t;
      const bulge=Math.sin(Math.PI*t)*Math.hypot(b[0]-a[0],b[1]-a[1])*0.12;
      out.push([lat+bulge, lng]);
    }
    return out;
  }
  return pts;
}
DAYS.forEach(day=>{
  (day.legs||[]).forEach(([f,t,mode,via])=>{
    const m = MODES[mode];
    const line = L.polyline(legPath(f,t,via,mode), {
      color:m.c, weight:3, opacity:.75, dashArray:m.dash||null}).addTo(map);
    line.on('click', ()=> openDay(day));
    (legLayers[day.d] = legLayers[day.d]||[]).push(line);
  });
});

// ── Stop markers, numbered by first day slept there ─────────────────────────
const firstDay = {};
DAYS.forEach(day=>{ if(!(day.at in firstDay)) firstDay[day.at]=day.d; });
Object.entries(STOPS).forEach(([id,s])=>{
  if (s.via) return;                       // waypoints get no marker
  const label = s.ex ? '·' : (firstDay[id] ?? '·');
  const mk = L.marker(s.ll, {icon: L.divIcon({className:'',
    html:`<div class="stopmark ${s.ex?'excursion':''}" id="mk-${id}">${label}</div>`,
    iconSize:[26,26], iconAnchor:[13,13]})}).addTo(map);
  mk.bindTooltip(s.n, {direction:'top', offset:[0,-14]});
  mk.on('click', ()=>{
    const day = DAYS.find(x=>x.at===id)
             || DAYS.find(x=>(x.legs||[]).some(l=>l[1]===id))
             || DAYS.find(x=>(x.legs||[]).some(l=>l[0]===id));
    if (day) openDay(day);
  });
});

// ── Sidebar ─────────────────────────────────────────────────────────────────
const list = document.getElementById('daylist');
let lastSec = null;
DAYS.forEach(day=>{
  if (day.sec!==lastSec){
    lastSec = day.sec;
    const h = document.createElement('div'); h.className='section';
    h.innerHTML = `<h2>${day.sec}</h2>`; list.appendChild(h);
  }
  const el = document.createElement('div');
  el.className='day'; el.id=`day-${day.d}`;
  const dots = [...new Set((day.legs||[]).map(l=>l[2]))]
    .map(m=>`<span class="dot" style="background:${MODES[m].c}"></span>`).join('');
  el.innerHTML = `<span class="n">${day.dl}</span><span>${day.t}</span>
                  <span class="modes">${dots}</span>`;
  el.onclick = ()=> openDay(day);
  list.appendChild(el);
});

// ── Detail card + highlighting ──────────────────────────────────────────────
const card = document.getElementById('card'), cardbody = document.getElementById('cardbody');
document.querySelector('#card .close').onclick = ()=>{ card.style.display='none'; setActive(null); };
let activeDay = null;   // day object

function setActive(day){
  if (activeDay){
    document.getElementById(`day-${activeDay.d}`)?.classList.remove('active');
    (legLayers[activeDay.d]||[]).forEach(l=>l.setStyle({weight:3, opacity:.75}));
    document.getElementById(`mk-${activeDay.at}`)?.classList.remove('hot');
  }
  activeDay = day || null;
  if (day){
    const el = document.getElementById(`day-${day.d}`);
    el?.classList.add('active');
    el?.scrollIntoView({block:'nearest'});
    (legLayers[day.d]||[]).forEach(l=>{ l.setStyle({weight:6, opacity:1}); l.bringToFront(); });
    document.getElementById(`mk-${day.at}`)?.classList.add('hot');
  }
}

function openDay(day){
  userTouched = true;
  setActive(day);
  const items = day.b.map(item=>{
    if (Array.isArray(item)){
      const [,mode,text]=item;
      return `<li class="transfer" style="--mode-c:${MODES[mode].c}">${text}</li>`;
    }
    return `<li>${item}</li>`;
  }).join('');
  cardbody.innerHTML = `
    <div class="where">Day${day.dl.includes('–')?'s':''} ${day.dl} · ${day.sec}</div>
    <h3>${day.t}</h3>
    <ul>${items}${day.warn?`<li class="warn">${day.warn}</li>`:''}</ul>
    <div class="sleep">Sleep: ${day.sleep}</div>`;
  card.style.display='block';
  // gently frame the stage's geography; long flights in and out only when
  // the stage has no ground legs, so a stage doesn't zoom out to Sydney
  const legs = day.legs||[];
  const ground = legs.filter(l=>l[2]!=='flight');
  const pts=[STOPS[day.at].ll];
  (ground.length ? ground : legs).forEach(([f,t,,via])=>{
    pts.push(STOPS[f].ll, STOPS[t].ll, ...(via||[]).map(v=>STOPS[v].ll));
  });
  // on phones the card covers the bottom of the map: frame the stage above it
  const narrow = matchMedia('(max-width:820px)').matches;
  const pad = narrow ? {paddingTopLeft:[0,90], paddingBottomRight:[0, card.offsetHeight+16]} : {};
  if (pts.length>1) map.fitBounds(L.latLngBounds(pts).pad(narrow?0.3:0.55), pad);
}
</script>
</body>
</html>
