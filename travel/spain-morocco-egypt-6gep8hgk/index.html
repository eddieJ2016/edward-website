<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spain &rarr; Gibraltar &rarr; Maroc &rarr; Egypt</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#111114; --panel:#1a1a1f; --panel2:#222229; --ink:#e8e6e0; --dim:#9a968c;
    --train:#e8b33c; --boat:#4da3ff; --road:#ff6a4d; --flight:#8fd3d6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; background:var(--bg); color:var(--ink);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  #app{display:flex; height:100%}
  #side{width:340px; min-width:280px; overflow-y:auto; background:var(--panel);
    border-right:1px solid #2c2c33; padding:18px 0 40px}
  #side h1{font-size:17px; letter-spacing:.08em; padding:0 18px 4px; text-transform:uppercase}
  #side .sub{font-size:12px; color:var(--dim); padding:0 18px 14px}
  .section{margin-top:14px}
  .section h2{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
    padding:6px 18px}
  .day{display:flex; gap:10px; align-items:baseline; padding:7px 18px; cursor:pointer;
    border-left:3px solid transparent; font-size:13.5px; line-height:1.35}
  .day:hover{background:var(--panel2)}
  .day.active{background:var(--panel2); border-left-color:var(--ink)}
  .day .n{font-weight:700; min-width:40px; color:var(--dim); white-space:nowrap}
  .day.active .n{color:var(--ink)}
  .day .modes{margin-left:auto; display:flex; gap:4px; align-self:center}
  .dot{width:8px; height:8px; border-radius:50%}
  #map{flex:1; min-width:0}
  .leaflet-container{background:#111114}
  /* numbered stop markers */
  .stopmark{display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; background:#26262e; color:var(--ink);
    border:2px solid #8a877e; font:700 11px 'Helvetica Neue',Helvetica,sans-serif;
    box-shadow:0 1px 6px rgba(0,0,0,.6)}
  .stopmark.excursion{border-style:dashed; opacity:.9}
  .stopmark.hot{border-color:var(--ink); background:#3a3a44}
  /* detail card */
  #card{position:absolute; right:16px; top:64px; z-index:1000; width:360px; max-width:calc(100% - 32px);
    max-height:calc(100% - 140px); overflow-y:auto; background:rgba(20,20,25,.96); border:1px solid #34343c;
    border-radius:8px; padding:16px 18px; display:none; box-shadow:0 6px 30px rgba(0,0,0,.55)}
  #card h3{font-size:15px; margin-bottom:2px}
  #card .where{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
    margin-bottom:10px}
  #card ul{list-style:none}
  #card li{font-size:13px; line-height:1.5; padding:3px 0 3px 14px; position:relative; color:#d8d5cd}
  #card li::before{content:''; position:absolute; left:0; top:10px; width:6px; height:6px;
    border-radius:50%; background:#5a5a64}
  #card li.transfer::before{background:var(--mode-c,#5a5a64)}
  #card li.transfer{color:var(--ink)}
  #card li.warn{color:#e6b8a2; font-style:italic}
  #card li.warn::before{background:#c07a55}
  #card .sleep{margin-top:10px; font-size:12px; color:var(--dim); border-top:1px solid #2e2e36; padding-top:8px}
  #card .close{position:absolute; top:8px; right:12px; cursor:pointer; color:var(--dim); font-size:18px}
  /* legend + view buttons */
  #legend{position:absolute; left:356px; bottom:16px; z-index:1000; background:rgba(20,20,25,.92);
    border:1px solid #34343c; border-radius:8px; padding:10px 14px; font-size:11.5px; display:flex;
    gap:14px; flex-wrap:wrap; max-width:calc(100% - 380px)}
  #legend span{display:flex; align-items:center; gap:6px; color:#cfccc4}
  #legend i{display:inline-block; width:18px; height:0; border-top:3px solid}
  #legend i.dash{border-top-style:dashed}
  #views{position:absolute; left:356px; top:16px; z-index:1000; display:flex; gap:8px; flex-wrap:wrap;
    max-width:calc(100% - 380px)}
  #views button{background:rgba(20,20,25,.92); color:var(--ink); border:1px solid #34343c;
    border-radius:6px; padding:7px 14px; font-size:12px; letter-spacing:.06em; cursor:pointer}
  #views button:hover{background:#2a2a32}
  @media (max-width:820px){
    #app{flex-direction:column}
    #side{width:100%; max-height:38%}
    #legend{left:16px; max-width:calc(100% - 32px)}
    /* keep the buttons and card on the map, below the stacked sidebar */
    #views{left:16px; top:calc(38% + 12px); max-width:calc(100% - 32px); gap:6px}
    #views button{padding:6px 10px; font-size:11px}
    #card{left:16px; right:16px; width:auto; top:auto; bottom:16px; max-height:44%}
    .leaflet-control-zoom{display:none}   /* pinch-zoom on phones; the legend sits there */
  }
</style>
</head>

// ── Map ─────────────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:false, minZoom:2, maxZoom:12, worldCopyJump:false});
L.control.zoom({position:'bottomright'}).addTo(map);   // top-left sits under the view buttons
// Basemap: Mapbox dark (crisp on Retina). If Mapbox refuses the tiles (offline, token
// revoked or URL-restricted, quota), fall back to Esri's keyless dark canvas.
// (CARTO's basemaps began requiring an API key in Oct 2026.)
const MAPBOX_TOKEN = 'pk.eyJ1IjoiZWR3YXJkanJhZGZvcmQiLCJhIjoiY212dW5kNGQxMDlreTJ4cHo5eDl6M2J3cyJ9.GR7NMsH6HE-dA-gC2HI7pg';
const mapbox = L.tileLayer(
  'https://api.mapbox.com/styles/v1/mapbox/dark-v11/tiles/512/{z}/{x}/{y}{r}?access_token='+MAPBOX_TOKEN,
  {tileSize:512, zoomOffset:-1,
   attribution:'&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> '+
     '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> '+
     '<a href="https://www.mapbox.com/map-feedback/">Improve this map</a>'}).addTo(map);
let tileErrors = 0;
mapbox.on('tileerror', ()=>{
  if (++tileErrors !== 3) return;          // a stray failure is not a refusal
  map.removeLayer(mapbox);
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  L.tileLayer(ESRI+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    {attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors', maxNativeZoom:16}).addTo(map);
  map.createPane('labels');               // place labels: above the base, below routes
  map.getPane('labels').style.zIndex = 350;
  map.getPane('labels').style.pointerEvents = 'none';
  L.tileLayer(ESRI+'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
    {maxNativeZoom:16, pane:'labels'}).addTo(map);
});

const routeLayer = L.layerGroup().addTo(map);  // legs and markers
const legLayers = {};                          // d -> layers[]
const fitAll = ()=> map.fitBounds(VIEWS.all.b, {padding:[24,24]});
// The container can be sized late (embedded panes resize after load). Keep
// re-fitting on every resize until the user first touches the map.
let userTouched = false;
map.getContainer().addEventListener('pointerdown', ()=>{ userTouched = true; }, {once:true});
const refit = ()=>{ map.invalidateSize(); if (!userTouched) fitAll(); };
window.addEventListener('load', ()=>{ refit(); setTimeout(refit, 250); });
new ResizeObserver(refit).observe(document.getElementById('map'));

// legend
document.getElementById('legend').innerHTML = Object.values(MODES).map(m=>
  `<span><i style="border-color:${m.c}" class="${m.dash?'dash':''}"></i>${m.label}</span>`).join('');

// ── Legs (polylines) ────────────────────────────────────────────────────────
function legPath(from, to, via, mode, track){
  if (track) return TRACKS[track];
  const pts = [STOPS[from].ll, ...(via||[]).map(v=>STOPS[v].ll), STOPS[to].ll];
  if (mode==='flight' && pts.length===2){        // curved arc for flights
    const [a,b]=pts, out=[];
    for (let i=0;i<=24;i++){
      const t=i/24, lat=a[0]+(b[0]-a[0])*t, lng=a[1]+(b[1]-a[1])*t;
      const bulge=Math.sin(Math.PI*t)*Math.hypot(b[0]-a[0],b[1]-a[1])*0.12;
      out.push([lat+bulge, lng]);
    }
    return out;
  }
  return pts;
}
DAYS.forEach(day=>{
  (day.legs||[]).forEach(([f,t,mode,via,track])=>{
    const m = MODES[mode];
    const line = L.polyline(legPath(f,t,via,mode,track), {
      color:m.c, weight:3, opacity:.75, dashArray:m.dash||null}).addTo(routeLayer);
    line.on('click', ()=> openDay(day));
    (legLayers[day.d] = legLayers[day.d]||[]).push(line);
  });
});

// stop markers, numbered by the January date of the first night there
const firstDay = {};
DAYS.forEach(day=>{ if(!(day.at in firstDay)) firstDay[day.at]=day.d; });
Object.entries(STOPS).forEach(([id,s])=>{
  if (s.via) return;                       // waypoints get no marker
  const label = s.ex ? '·' : (firstDay[id] ?? '·');
  const mk = L.marker(s.ll, {icon: L.divIcon({className:'',
    html:`<div class="stopmark ${s.ex?'excursion':''}" id="mk-${id}">${label}</div>`,
    iconSize:[26,26], iconAnchor:[13,13]})}).addTo(routeLayer);
  mk.bindTooltip(s.n, {direction:'top', offset:[0,-14]});
  mk.on('click', ()=>{
    const day = DAYS.find(x=>x.at===id)
             || DAYS.find(x=>(x.legs||[]).some(l=>l[1]===id))
             || DAYS.find(x=>(x.legs||[]).some(l=>l[0]===id));
    if (day) openDay(day);
  });
});

DAYS.forEach(day=>{

    lastSec = day.sec;
    const h = document.createElement('div'); h.className='section';
    h.innerHTML = `<h2>${day.sec}</h2>`; list.appendChild(h);
  }
  const el = document.createElement('div');
  el.className='day'; el.id=`day-${day.d}`;
  const dots = [...new Set((day.legs||[]).map(l=>l[2]))]

  el.innerHTML = `<span class="n">${day.dl}</span><span>${day.t}</span>
                  <span class="modes">${dots}</span>`;

// ── Detail card + highlighting ──────────────────────────────────────────────
const card = document.getElementById('card'), cardbody = document.getElementById('cardbody');
document.querySelector('#card .close').onclick = ()=>{ card.style.display='none'; setActive(null); };
let activeDay = null;   // day object

function setActive(day){
  if (activeDay){
    document.getElementById(`day-${activeDay.d}`)?.classList.remove('active');
    (legLayers[activeDay.d]||[]).forEach(l=>l.setStyle({weight:3, opacity:.75}));
    document.getElementById(`mk-${activeDay.at}`)?.classList.remove('hot');
  }
  activeDay = day || null;
  if (day){
    const el = document.getElementById(`day-${day.d}`);
    el?.classList.add('active');
    el?.scrollIntoView({block:'nearest'});
    (legLayers[day.d]||[]).forEach(l=>{ l.setStyle({weight:6, opacity:1}); l.bringToFront(); });
    document.getElementById(`mk-${day.at}`)?.classList.add('hot');
  }
}

function openDay(day){
  userTouched = true;
  setActive(day);
  const items = day.b.map(item=>{
    if (Array.isArray(item)){
      const [,mode,text]=item;
      return `<li class="transfer" style="--mode-c:${MODES[mode].c}">${text}</li>`;
    }
    return `<li>${item}</li>`;
  }).join('');
  cardbody.innerHTML = `
    <div class="where">${day.dl} January · ${day.sec}</div>
    <h3>${day.t}</h3>
    <ul>${items}${[].concat(day.warn||[]).map(w=>`<li class="warn">${w}</li>`).join('')}</ul>
    <div class="sleep">Sleep: ${day.sleep}</div>`;
  card.style.display='block';
  // gently frame the stage's geography; long flights in and out only when
  // the stage has no ground legs, so a stage doesn't zoom out to Sydney
  const legs = day.legs||[];
  const ground = legs.filter(l=>l[2]!=='flight');
  const pts=[STOPS[day.at].ll];
  (ground.length ? ground : legs).forEach(([f,t,,via,track])=>{
    pts.push(STOPS[f].ll, STOPS[t].ll, ...(via||[]).map(v=>STOPS[v].ll), ...(track ? TRACKS[track] : []));
  });
  // on phones the card covers the bottom of the map: frame the stage above it
  const narrow = matchMedia('(max-width:820px)').matches;
  // on a wide screen keep it clear of the card, so a stage like the Strait isn't hidden
  const wide = map.getSize().x > 900;
  const pad = narrow ? {paddingTopLeft:[0,90], paddingBottomRight:[0, card.offsetHeight+16]}
            : wide ? {paddingBottomRight:[card.offsetWidth+32,0]} : {};
  if (pts.length>1) map.fitBounds(L.latLngBounds(pts).pad(narrow?0.3:0.55), pad);
  else map.setView(pts[0], 9);              // a stage with no legs: just centre the stop
}
